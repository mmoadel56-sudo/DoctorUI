<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پزشک‌یاب | رزرو آنلاین</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">✚</span><div><b>پزشک‌یاب</b><small>رزرو آنلاین پزشک</small></div></div>
  <nav><a class="active" href="index.html">رزرو</a><a href="admin.html">پنل مدیریت</a></nav>
</header>

<main class="container">
  <section class="hero">
    <div>
      <span class="badge">رزرو سریع و ساده</span>
      <h1>پزشک موردنظرت را پیدا کن</h1>
      <p>پزشکان را ببین، برنامه کاری را بررسی کن و زمان مناسب را رزرو کن.</p>
    </div>
    <div class="hero-card"><span>امروز</span><strong id="today">—</strong><small>نوبت‌های قابل رزرو</small></div>
  </section>

  <section class="searchbar">
    <input id="search" type="search" placeholder="جست‌وجوی نام پزشک یا تخصص...">
    <select id="sort"><option value="all">همه پزشکان</option><option value="available">دارای نوبت</option></select>
  </section>

  <section id="doctorList" class="doctor-grid"></section>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button class="close" onclick="closeModal()">×</button>
    <div id="modalContent"></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="script.js"></script>
</body>
</html>
