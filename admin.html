<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت پزشکان</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">✚</span><div><b>پزشک‌یاب</b><small>پنل مدیریت</small></div></div>
  <nav><a href="index.html">رزرو</a><a class="active" href="admin.html">پنل مدیریت</a></nav>
</header>

<main class="container">
  <div class="page-head">
    <div><span class="badge">Admin Dashboard</span><h1>مدیریت پزشکان</h1><p>ایجاد، ویرایش و حذف پزشکان و مشاهده برنامه کاری.</p></div>
    <button class="primary" onclick="openCreate()">＋ افزودن پزشک</button>
  </div>

  <section class="stats">
    <div><span>پزشکان</span><b id="doctorCount">0</b></div>
    <div><span>نوبت‌های رزروشده</span><b id="reservedCount">0</b></div>
    <div><span>نوبت‌های آزاد</span><b id="freeCount">0</b></div>
  </section>

  <section class="panel">
    <div class="panel-title"><h2>لیست پزشکان</h2><input id="adminSearch" placeholder="جست‌وجو..."></div>
    <div class="table-wrap"><table><thead><tr><th>پزشک</th><th>تخصص/توضیحات</th><th>تلفن</th><th>آدرس</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody id="adminTable"></tbody></table></div>
  </section>
</main>

<div id="doctorModal" class="modal hidden">
  <div class="modal-box">
    <button class="close" onclick="closeDoctorModal()">×</button>
    <h2 id="formTitle">افزودن پزشک</h2>
    <form id="doctorForm">
      <input type="hidden" id="doctorId">
      <label>نام پزشک<input id="name" required maxlength="100"></label>
      <label>تخصص / توضیحات<textarea id="description" maxlength="800"></textarea></label>
      <label>شماره تماس<input id="phone" maxlength="11"></label>
      <label>آدرس<input id="address" required maxlength="800"></label>
      <label>ساعات کاری (مثلاً 09:00-12:00, 16:00-19:00)<input id="schedule" placeholder="09:00-12:00, 16:00-19:00"></label>
      <button class="primary full" type="submit">ذخیره پزشک</button>
    </form>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="admin.js"></script>
</body>
</html>
